<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Enquiry | Vuilgat!</title>
    <link rel="stylesheet" href="css/style.css">

    <main>
<img src="logo.png" >
        <section id="page-heading">
            <h1>Product &amp; Order Enquiry</h1>
            <p>Ask about pricing, stock availability, custom sticker orders, or becoming a stockist. We'll get back
                to you with the details you need.</p>
        </section>

        <!-- Enquiry form: JavaScript validation and dynamic response handling to be added in Part 3 -->
        <section id="enquiry-form-section">
            <form id="enquiry-form" action="#" method="post">

                <div class="form-group">
                    <label for="full-name">Full Name</label>
                    <input type="text" id="full-name" name="full-name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="e.g. 0821234567" pattern="[0-9]{10}">
                </div>

                <div class="form-group">
                    <label for="enquiry-type">Enquiry Type</label>
                    <select id="enquiry-type" name="enquiry-type" required>
                        <option value="">-- Please select --</option>
                        <option value="tshirt-availability">T-Shirt Pricing / Availability</option>
                        <option value="sticker-custom">Custom Sticker Order</option>
                        <option value="bulk-order">Bulk / Event Order</option>
                        <option value="stockist">Becoming a Stockist</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="item-reference">Item(s) You're Asking About</label>
                    <select id="enquiry-type" name="enquiry-type" required>
                        <option value="">-- Please select --</option>
                        <option value="tokyo-van-tee-red"> tokyo-van-tee-red</option>
                        <option value="tokyo-van-tee-black">tokyo-van-tee-back</option>
                        <option value="tokyo-van-tee-white">tokyo-van-tee-white</option>
                        <option value="tokyo-van-tee-green">tokyo-van-tee-green</option>
                        <option value="Circle Logo Tee – Pink">Circle Logo Tee – Pink</option>
                        <option value="Circle Logo Tee – Maroon">Circle Logo Tee – Maroon</option>
                        <option value="Circle Logo Tee – White">Circle Logo Tee – White</option>
                        <option value="Circle Logo Tee – Navy">Circle Logo Tee – Navy</option>
                        <option value="Circle Logo Tee – Green">Circle Logo Tee – Green</option>
                         <option value="Circle Logo Tee – Black">Circle Logo Tee – Black</option>

                        
                        
                        
                        
                        

                    
                      

                        <option value="stickers ">window screen/phone/laptop/ size </option>
                        
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6" required></textarea>
                </div>

                <button type="submit">Submit Enquiry</button>

                <!-- Placeholder for the JS-generated response (cost / availability) built in Part 3 -->
                <div id="enquiry-response" aria-live="polite"></div>

            </form>
        </section>

    </main>

    <footer>
        
        <nav aria-label="Footer navigation">
            <ul>
                <a href="about.html">About Us|</a>
                <a href="shop.html">Shop|</a>
                <a href="enquiry.html">Enquiry|</a>
                <a href="contact.html">Contact|</a>
            </ul>

            <p>&copy; 2026 Vuilgat. All rights reserved.</p>
        </nav>
    </footer>

</body>
</html>
